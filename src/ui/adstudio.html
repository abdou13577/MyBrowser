<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src * data: blob:; media-src * blob: data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'wasm-unsafe-eval'; connect-src 'self' data: blob:">
<title>Ad Studio</title>
<style>
  :root { --void:#090A16; --panel:#0E1030; --ink:#EEF0FF; --mist:#A3A8C8; --line:rgba(255,255,255,.10); --iris:#8B7CFF; --azure:#4F8CFF; --aqua:#2EE6D6; --bloom:#FF6FD8;
    --ai: linear-gradient(120deg, var(--iris), var(--azure) 55%, var(--aqua)); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { height: 100vh; display: flex; flex-direction: column; color: var(--ink); overflow: hidden;
    font: 14px/1.5 "Segoe UI Variable Text", "Segoe UI", "Noto Sans Arabic", system-ui, sans-serif; -webkit-font-smoothing: antialiased;
    background: radial-gradient(800px 500px at 80% -10%, rgba(139,124,255,.16), transparent 60%), var(--void); }
  header { height: 56px; flex: none; display: flex; align-items: center; gap: 12px; padding: 0 18px; border-bottom: 1px solid var(--line); }
  header h1 { margin: 0; font-size: 18px; font-weight: 650; background: var(--ai); -webkit-background-clip: text; background-clip: text; color: transparent; }
  header .tag { font-size: 12px; color: var(--mist); }
  .modes { margin-inline-start: auto; display: flex; background: rgba(255,255,255,.05); border: 1px solid var(--line); border-radius: 12px; padding: 3px; }
  .modes button { border: 0; background: transparent; color: var(--mist); font: inherit; font-weight: 600; padding: 7px 16px; border-radius: 9px; cursor: pointer; }
  .modes button.on { background: var(--ai); color: #0A0B16; }
  main { flex: 1; display: flex; min-height: 0; }
  .panel { width: 380px; flex: none; border-inline-end: 1px solid var(--line); overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 16px; }
  .stage { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 20px; position: relative; }
  .frame { position: relative; box-shadow: 0 20px 60px rgba(0,0,0,.5); border-radius: 10px; overflow: hidden; background: #000; max-height: calc(100vh - 170px); }
  canvas { display: block; max-width: 100%; max-height: calc(100vh - 170px); }
  .stagebar { display: flex; gap: 10px; align-items: center; }
  .field label { display: block; font-size: 12px; color: var(--mist); margin-bottom: 6px; font-weight: 600; }
  input[type=text], textarea, select { width: 100%; background: rgba(255,255,255,.05); border: 1px solid var(--line); border-radius: 11px; color: var(--ink); padding: 10px 12px; font: inherit; outline: none; }
  input[type=text]:focus, textarea:focus, select:focus { border-color: var(--azure); }
  textarea { resize: vertical; min-height: 70px; }
  .drop { border: 1.5px dashed rgba(255,255,255,.22); border-radius: 14px; padding: 16px; text-align: center; color: var(--mist); cursor: pointer; transition: border-color .15s, background .15s; }
  .drop:hover, .drop.over { border-color: var(--azure); background: rgba(79,140,255,.08); color: var(--ink); }
  .thumbs { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .thumb { position: relative; width: 60px; height: 60px; border-radius: 10px; overflow: hidden; border: 1px solid var(--line); }
  .thumb img { width: 100%; height: 100%; object-fit: cover; }
  .thumb button { position: absolute; top: 2px; inset-inline-end: 2px; width: 18px; height: 18px; border-radius: 50%; border: 0; background: rgba(10,11,22,.8); color: #fff; font-size: 11px; cursor: pointer; line-height: 1; }
  .aibtn { width: 100%; height: 42px; border: 0; border-radius: 12px; background: var(--ai); color: #0A0B16; font: inherit; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .aibtn:disabled { opacity: .55; cursor: progress; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { border: 1px solid var(--line); background: rgba(255,255,255,.04); color: var(--ink); border-radius: 10px; padding: 8px 12px; font: inherit; font-weight: 600; cursor: pointer; font-size: 13px; }
  .chip.on { border-color: transparent; background: var(--ai); color: #0A0B16; }
  .tpl { display: grid; grid-template-columns: repeat(4,1fr); gap: 8px; }
  .tpl button { aspect-ratio: 3/4; border: 1px solid var(--line); border-radius: 10px; background: rgba(255,255,255,.04); cursor: pointer; padding: 0; overflow: hidden; }
  .tpl button.on { outline: 2px solid var(--azure); }
  .tpl canvas { width: 100%; height: 100%; }
  .colorrow { display: flex; align-items: center; gap: 10px; }
  .colorrow input[type=color] { width: 40px; height: 34px; border: 1px solid var(--line); border-radius: 9px; background: none; padding: 2px; cursor: pointer; }
  .switch { display: flex; align-items: center; gap: 10px; color: var(--ink); font-weight: 600; font-size: 13px; }
  hr { border: 0; border-top: 1px solid var(--line); margin: 2px 0; }
  .export { height: 46px; padding: 0 22px; border: 0; border-radius: 13px; background: var(--ai); color: #0A0B16; font: inherit; font-weight: 700; cursor: pointer; }
  .ghost { height: 46px; padding: 0 18px; border: 1px solid var(--line); border-radius: 13px; background: rgba(255,255,255,.05); color: var(--ink); font: inherit; font-weight: 600; cursor: pointer; }
  .export:disabled, .ghost:disabled { opacity: .55; cursor: progress; }
  #msg { font-size: 13px; color: var(--aqua); min-height: 18px; }
  .hint { font-size: 12px; color: #6E7396; }
  .small { font-size: 12px; color: var(--mist); }
  .hide { display: none !important; }
  .recdot { width: 10px; height: 10px; border-radius: 50%; background: #FF5470; animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: .3; } }
</style>
</head>
<body>
  <header>
    <h1>Ad Studio</h1><span class="tag" id="tagline"></span>
    <div class="modes"><button id="mVideo" class="on"></button><button id="mImage"></button></div>
  </header>
  <main>
    <section class="panel">
      <div class="field">
        <label id="lUpload"></label>
        <div class="drop" id="drop"><div id="dropText"></div></div>
        <input type="file" id="file" accept="image/*" multiple hidden>
        <div class="thumbs" id="thumbs"></div>
      </div>
      <div class="field">
        <label id="lBrief"></label>
        <textarea id="brief" placeholder=""></textarea>
        <button class="aibtn" id="aiBtn" style="margin-top:10px"><span id="aiLabel"></span></button>
        <div class="hint" id="aiHint"></div>
      </div>
      <hr>
      <div class="field"><label id="lHeadline"></label><input type="text" id="headline"></div>
      <div class="field" id="subField"><label id="lSub"></label><input type="text" id="sub"></div>
      <div class="field"><label id="lCta"></label><input type="text" id="cta"></div>
      <div class="field">
        <label id="lAspect"></label>
        <div class="chips" id="aspect"></div>
      </div>
      <div class="field" id="tplField">
        <label id="lTemplate"></label>
        <div class="tpl" id="tpl"></div>
      </div>
      <div class="field">
        <label id="lColor"></label>
        <div class="colorrow"><input type="color" id="accent" value="#8B7CFF"><span class="small" id="colorHint"></span></div>
      </div>
      <div class="field">
        <label id="lLogo"></label>
        <button class="chip" id="logoBtn"></button>
        <input type="file" id="logoFile" accept="image/*" hidden>
      </div>
      <div class="field" id="musicField">
        <label class="switch"><input type="checkbox" id="music" checked> <span id="lMusic"></span></label>
      </div>
    </section>
    <section class="stage">
      <div class="frame"><canvas id="preview" width="432" height="768"></canvas></div>
      <div class="stagebar">
        <button class="ghost hide" id="playBtn"></button>
        <button class="export" id="exportBtn"></button>
        <button class="ghost hide" id="revealBtn"></button>
      </div>
      <div id="msg"></div>
    </section>
  </main>
<script src="adstudio.js"></script>
</body>
</html>
