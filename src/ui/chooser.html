<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src https: data:; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title>MyBrowser</title>
<style>
  :root { --void:#090A16; --ink:#EEF0FF; --mist:#A3A8C8; --line:rgba(255,255,255,.10); --iris:#8B7CFF; --azure:#4F8CFF; --aqua:#2EE6D6;
    --ai: linear-gradient(120deg, var(--iris), var(--azure) 55%, var(--aqua)); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { height: 100vh; display: flex; flex-direction: column; align-items: center; color: var(--ink); overflow: hidden;
    font: 15px/1.5 "Segoe UI Variable Text", "Segoe UI", "Noto Sans Arabic", system-ui, sans-serif; -webkit-font-smoothing: antialiased;
    background: radial-gradient(60% 50% at 30% 10%, rgba(139,124,255,.22), transparent 70%),
      radial-gradient(55% 45% at 85% 20%, rgba(46,230,214,.12), transparent 70%), var(--void); }
  .bar { height: 40px; width: 100%; -webkit-app-region: drag; display: flex; align-items: center; justify-content: flex-end; padding: 0 8px; flex: none; }
  .x { -webkit-app-region: no-drag; width: 34px; height: 28px; border: 0; border-radius: 8px; background: transparent; color: var(--mist); font-size: 16px; cursor: pointer; }
  .x:hover { background: rgba(255,255,255,.08); color: var(--ink); }
  main { flex: 1; width: 100%; max-width: 640px; margin: 0 auto; padding: 4px 28px 28px; display: flex; flex-direction: column; overflow: hidden; }
  h1 { margin: 6px 0 2px; font-size: 26px; font-weight: 650; letter-spacing: -.01em;
    background: var(--ai); -webkit-background-clip: text; background-clip: text; color: transparent; text-align: center; }
  .sub { color: var(--mist); text-align: center; margin: 0 0 20px; }
  .list { display: flex; flex-direction: column; gap: 10px; overflow-y: auto; padding: 2px; }
  .acc { display: flex; align-items: center; gap: 14px; padding: 12px 14px; border-radius: 16px; cursor: pointer; text-align: start;
    border: 1px solid var(--line); background: linear-gradient(160deg, rgba(255,255,255,.06), rgba(255,255,255,.02)); color: var(--ink); font: inherit;
    transition: transform .12s, border-color .12s, background .12s; }
  .acc:hover { transform: translateY(-1px); border-color: rgba(139,124,255,.5); background: linear-gradient(160deg, rgba(255,255,255,.1), rgba(255,255,255,.035)); }
  .acc:focus-visible { outline: 2px solid var(--azure); outline-offset: 2px; }
  .av { width: 52px; height: 52px; border-radius: 50%; flex: none; display: grid; place-items: center; overflow: hidden;
    color: #0A0B16; font-weight: 700; font-size: 21px; box-shadow: 0 4px 14px rgba(0,0,0,.35); }
  .av img { width: 100%; height: 100%; object-fit: cover; }
  .who { min-width: 0; flex: 1; }
  .who b { display: block; font-weight: 600; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .who span { display: block; color: var(--mist); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; direction: ltr; text-align: start; }
  .chev { color: var(--mist); flex: none; }
  [dir=rtl] .chev { transform: scaleX(-1); }
  .foot { display: flex; gap: 10px; margin-top: 16px; flex: none; }
  .foot button { flex: 1; height: 44px; border-radius: 13px; border: 1px solid var(--line); background: rgba(255,255,255,.05); color: var(--ink);
    font: inherit; font-weight: 600; cursor: pointer; }
  .foot button:hover { border-color: rgba(139,124,255,.5); background: rgba(255,255,255,.08); }
  .foot .add { background: var(--ai); color: #0A0B16; border: 0; }
  #msg { text-align: center; color: var(--aqua); font-size: 13px; min-height: 18px; margin-top: 10px; flex: none; }
</style>
</head>
<body>
  <div class="bar"><button class="x" id="closeBtn" title="×">✕</button></div>
  <main>
    <h1 id="title"></h1>
    <p class="sub" id="sub"></p>
    <div class="list" id="list"></div>
    <div class="foot">
      <button id="guestBtn"></button>
      <button class="add" id="addBtn"></button>
    </div>
    <div id="msg"></div>
  </main>
<script src="chooser.js"></script>
</body>
</html>
