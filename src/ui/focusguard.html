<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<title>Focus Guard</title>
<style>
  :root { --void:#090A16; --card:#11132A; --ink:#EEF0FF; --mist:#A3A8C8; --line:rgba(255,255,255,.10); --iris:#8B7CFF; --azure:#4F8CFF; --aqua:#2EE6D6; --ai:linear-gradient(120deg,var(--iris),var(--azure) 55%,var(--aqua)); }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--void); color: var(--ink); font: 14px/1.5 "Segoe UI Variable Text","Segoe UI","Noto Sans Arabic",system-ui,sans-serif; }
  body { padding: 24px; max-width: 720px; margin: 0 auto; }
  h1 { margin: 0; font-size: 23px; background: var(--ai); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .sub { color: var(--mist); font-size: 13px; margin: 4px 0 18px; }
  .add { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 18px; }
  input { height: 38px; border-radius: 10px; border: 1px solid var(--line); background: rgba(255,255,255,.05); color: var(--ink); padding: 0 12px; font: inherit; outline: none; }
  input:focus { border-color: var(--azure); }
  #dom { flex: 1; min-width: 180px; direction: ltr; }
  #mins { width: 100px; text-align: center; }
  .btn { height: 38px; padding: 0 16px; border-radius: 10px; border: 0; cursor: pointer; font: inherit; font-weight: 600; }
  .btn.primary { background: var(--ai); color: #090A16; }
  .btn.danger { height: 30px; padding: 0 10px; font-size: 12px; background: rgba(224,70,106,.16); color: #ff8aa4; border: 1px solid rgba(224,70,106,.35); }
  .list { display: flex; flex-direction: column; gap: 10px; }
  .row { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .bar { height: 7px; border-radius: 999px; background: rgba(255,255,255,.08); overflow: hidden; }
  .bar > i { display: block; height: 100%; background: var(--ai); border-radius: 999px; }
  .empty { text-align: center; padding: 40px 18px; color: var(--mist); border: 1px dashed var(--line); border-radius: 14px; }
</style>
</head>
<body>
  <h1 id="hTitle"></h1>
  <p class="sub" id="hSub"></p>
  <form class="add" id="f">
    <input id="dom" placeholder="tiktok.com">
    <input id="mins" type="number" min="1" max="480" value="20">
    <button class="btn primary" type="submit" id="addBtn"></button>
  </form>
  <div class="list" id="list"></div>
<script>
const STR = {
  ar: { title: 'مؤقّت الانضباط وكابح التشتّت', sub: 'حدّد وقتاً يومياً للمواقع المُشتّتة ليذكّرك المتصفح بلطف عند انتهاء الوقت', add: 'إضافة حد يومي', min: 'دقيقة', del: 'إزالة', empty: 'لم تحدد أي موقع بعد. مثال: tiktok.com لمدة 20 دقيقة يومياً.' },
  en: { title: 'Site Time Budget', sub: 'Set a daily time limit for distracting sites', add: 'Add daily limit', min: 'min', del: 'Remove', empty: 'No site limits yet. Example: tiktok.com for 20 min/day.' },
  de: { title: 'Zeitlimit-Wächter', sub: 'Tägliches Zeitlimit für ablenkende Seiten festlegen', add: 'Limit hinzufügen', min: 'Min.', del: 'Entfernen', empty: 'Noch keine Limits festgelegt.' }
};
const lang = (new URLSearchParams(location.search).get('lang') || 'ar').slice(0, 2);
const L = STR[lang] || STR.en;
document.documentElement.lang = lang;
document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
document.title = L.title;
document.getElementById('hTitle').textContent = L.title;
document.getElementById('hSub').textContent = L.sub;
document.getElementById('addBtn').textContent = L.add;

async function load() {
  const { limits, used } = await window.mbFocus.get();
  const box = document.getElementById('list');
  box.innerHTML = '';
  const keys = Object.keys(limits || {});
  if (!keys.length) { const d = document.createElement('div'); d.className = 'empty'; d.textContent = L.empty; box.append(d); return; }
  for (const dom of keys) {
    const lim = limits[dom];
    const uMin = Math.round(((used && used[dom]) || 0) / 60);
    const pct = Math.min(100, Math.round((uMin / Math.max(1, lim)) * 100));
    const row = document.createElement('div'); row.className = 'row';
    const top = document.createElement('div'); top.className = 'top';
    const b = document.createElement('b'); b.textContent = dom; b.style.direction = 'ltr';
    const stat = document.createElement('span'); stat.textContent = `${uMin} / ${lim} ${L.min}`; stat.style.color = '#A3A8C8';
    const del = document.createElement('button'); del.className = 'btn danger'; del.textContent = L.del;
    del.onclick = async () => { await window.mbFocus.remove(dom); load(); };
    top.append(b, stat, del);
    const bar = document.createElement('div'); bar.className = 'bar';
    const fill = document.createElement('i'); fill.style.width = pct + '%';
    bar.append(fill);
    row.append(top, bar);
    box.append(row);
  }
}

document.getElementById('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const r = await window.mbFocus.set(document.getElementById('dom').value, document.getElementById('mins').value);
  if (r && r.ok) { document.getElementById('dom').value = ''; load(); }
});
load();
</script>
</body>
</html>
