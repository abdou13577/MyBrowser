<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>New tab</title>
<script src="i18n.js"></script>
<style>
  :root {
    --void: #090A16; --iris: #8B7CFF; --azure: #4F8CFF; --aqua: #2EE6D6; --bloom: #FF6FD8;
    --ink: #EEF0FF; --mist: #A3A8C8; --line: rgba(255,255,255,.10);
    --ai: linear-gradient(120deg, var(--iris), var(--azure) 55%, var(--aqua));
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0;
    background: var(--void); color: var(--ink); overflow-x: hidden;
    font: 15px/1.5 "Segoe UI Variable Text", "Segoe UI Variable", "Segoe UI", "Noto Sans Arabic", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  /* سماء الذكاء الاصطناعي: ثلاث هالات ضوئية ثابتة */
  body::before {
    content: ''; position: fixed; inset: -20%; z-index: -1; pointer-events: none;
    background:
      radial-gradient(38% 32% at 22% 18%, rgba(139,124,255,.28), transparent 70%),
      radial-gradient(34% 30% at 80% 26%, rgba(46,230,214,.16), transparent 70%),
      radial-gradient(40% 36% at 55% 92%, rgba(255,111,216,.12), transparent 70%);
    filter: blur(10px);
  }
  .clock {
    font-family: "Segoe UI Variable Display", "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
    font-weight: 200; font-size: clamp(64px, 11vw, 132px); line-height: 1; letter-spacing: -2px;
    background: linear-gradient(180deg, #FFFFFF 10%, #B9B8FF 60%, #7FE9F0); -webkit-background-clip: text; background-clip: text; color: transparent;
    font-variant-numeric: tabular-nums;
  }
  .greet { color: var(--mist); margin: 10px 0 34px; font-size: 16px; }
  form.searchbox { width: min(640px, 90vw); position: relative; }
  .search {
    width: 100%; height: 56px; border-radius: 28px; padding: 0 56px 0 24px; font: inherit; font-size: 16px; color: var(--ink); outline: none;
    border: 1px solid transparent;
    background: linear-gradient(rgba(20,22,48,.85), rgba(20,22,48,.85)) padding-box, linear-gradient(var(--line), var(--line)) border-box;
    box-shadow: 0 14px 40px rgba(3,4,18,.55), inset 0 1px 0 rgba(255,255,255,.07);
    backdrop-filter: blur(18px);
  }
  [dir=rtl] .search { padding: 0 24px 0 56px; }
  .search:focus { background: linear-gradient(#15173A, #15173A) padding-box, var(--ai) border-box; box-shadow: 0 0 0 5px rgba(79,140,255,.14), 0 14px 40px rgba(3,4,18,.55); }
  .search::placeholder { color: #737899; }
  .go { position: absolute; top: 8px; inset-inline-end: 8px; width: 40px; height: 40px; border-radius: 50%; border: 0; cursor: pointer;
    background: var(--ai); display: grid; place-items: center; }
  .go svg { width: 18px; height: 18px; fill: none; stroke: #0A0B16; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  [dir=rtl] .go svg { transform: scaleX(-1); }

  /* الاختصارات: زجاج، وتُضاف وتُحذف */
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, 104px); justify-content: center; gap: 14px; width: min(1000px, 92vw); margin-top: 28px; }
  .tile { position: relative; height: 112px; border-radius: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
    text-decoration: none; color: var(--ink); font-size: 13px; cursor: pointer; border: 1px solid var(--line);
    background: linear-gradient(160deg, rgba(255,255,255,.08), rgba(255,255,255,.025));
    box-shadow: inset 0 1px 0 rgba(255,255,255,.08); transition: transform .15s, border-color .15s, background .15s; }
  .tile:hover { transform: translateY(-2px); border-color: rgba(139,124,255,.45); background: linear-gradient(160deg, rgba(255,255,255,.11), rgba(255,255,255,.04)); }
  .tile:focus-visible { outline: 2px solid var(--azure); outline-offset: 3px; }
  .logo { width: 50px; height: 50px; border-radius: 15px; display: grid; place-items: center; background: rgba(255,255,255,.92);
    box-shadow: 0 6px 18px rgba(0,0,0,.35); font-weight: 700; font-size: 20px; color: #20223F; overflow: hidden; }
  .logo img { width: 30px; height: 30px; }
  .name { max-width: 92px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .del { position: absolute; top: 6px; inset-inline-end: 6px; width: 22px; height: 22px; border-radius: 50%; border: 0; cursor: pointer;
    background: rgba(10,11,22,.75); color: var(--mist); font-size: 12px; display: none; }
  .tile:hover .del { display: block; }
  .del:hover { color: #fff; background: #E0466A; }
  .add .logo { background: rgba(255,255,255,.06); border: 1.5px dashed rgba(255,255,255,.28); box-shadow: none; color: var(--ink); font-weight: 300; font-size: 28px; }

  /* نافذة إضافة موقع */
  dialog { border: 1px solid rgba(255,255,255,.16); border-radius: 22px; padding: 26px 28px 24px; width: min(460px, 92vw); color: var(--ink);
    background: rgba(18,20,46,.97); box-shadow: 0 20px 60px rgba(0,0,0,.6); overflow: visible; max-height: none; box-sizing: border-box; }
  dialog *, dialog *::before, dialog *::after { box-sizing: border-box; }
  dialog form { display: block; margin: 0; width: 100%; }
  dialog::backdrop { background: rgba(4,5,14,.55); backdrop-filter: blur(4px); }
  dialog h2 { margin: 0 0 14px; font-size: 17px; font-weight: 600; }
  dialog label { display: block; color: var(--mist); font-size: 12.5px; margin: 10px 0 5px; }
  dialog input { display: block; width: 100%; height: 44px; border-radius: 12px; border: 1px solid var(--line); background: rgba(255,255,255,.05); color: var(--ink);
    padding: 0 12px; font: inherit; outline: none; }
  dialog input:focus { border-color: var(--azure); }
  .row { display: flex; gap: 10px; justify-content: flex-end; margin-top: 22px; }
  .btn { height: 40px; min-width: 96px; padding: 0 20px; border-radius: 12px; border: 0; cursor: pointer; font: inherit; font-weight: 600; }
  .btn.ok { background: var(--ai); color: #0A0B16; }
  .btn.cancel { background: rgba(255,255,255,.08); color: var(--ink); }
  .appsbtn { display: inline-flex; align-items: center; gap: 8px; margin-top: 18px; height: 38px; padding: 0 16px 0 12px; border-radius: 999px; text-decoration: none;
    color: var(--ink); font-weight: 600; font-size: 13.5px; border: 1px solid rgba(139,124,255,.45);
    background: linear-gradient(110deg, rgba(139,124,255,.22), rgba(79,140,255,.16) 50%, rgba(46,230,214,.14)); }
  .appsbtn svg { width: 18px; height: 18px; fill: none; stroke: #C9C2FF; stroke-width: 1.8; }
  .appsbtn:hover { border-color: rgba(46,230,214,.6); }
  .appsbtn:focus-visible { outline: 2px solid var(--azure); outline-offset: 3px; }
  .btnrow { display: flex; gap: 12px; margin-top: 18px; flex-wrap: wrap; justify-content: center; }
  .btnrow .appsbtn { margin-top: 0; }
  .note { margin-top: 46px; color: #6E7396; font-size: 12.5px; text-align: center; max-width: 90vw; }
</style>
</head>
<body>
  <div class="clock" id="clock"></div>
  <div class="greet" id="greet"></div>
  <form class="searchbox" action="https://www.google.com/search" method="get">
    <input class="search" name="q" id="q" autofocus autocomplete="off">
    <button class="go" type="submit" aria-label="Search"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
  </form>
  <div class="btnrow">
  <a class="appsbtn" id="appsBtn" href="https://apps.mybrowser.invalid/"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="6.5" height="6.5" rx="2"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="2"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="2"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="2"/></svg><span id="appsLbl">Apps</span></a>
  <a class="appsbtn" id="historyBtn" href="https://history.mybrowser.invalid/"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg><span id="historyLbl">History</span></a>
  <a class="appsbtn" id="downloadsBtn" href="https://downloads.mybrowser.invalid/"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v11m0 0l-4-4m4 4l4-4"/><path d="M5 20h14"/></svg><span id="downloadsLbl">Downloads</span></a>
  <a class="appsbtn" id="backupBtn" href="https://backup.mybrowser.invalid/"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h10l4 4v12H5z"/><path d="M8 4v6h6"/><circle cx="12" cy="15" r="2"/></svg><span id="backupLbl">Backup</span></a>
  <a class="appsbtn" id="wsBtn" href="https://workspaces.mybrowser.invalid/"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="6" rx="2"/><rect x="3" y="14" width="8" height="6" rx="2"/><rect x="13" y="14" width="8" height="6" rx="2"/></svg><span id="wsLbl">Workspaces</span></a>
  <a class="appsbtn" id="snapsBtn" href="https://snapshots.mybrowser.invalid/"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4h12v16l-6-4-6 4z"/></svg><span id="snapsLbl">Offline</span></a>
  <a class="appsbtn" id="radarBtn" href="https://prices.mybrowser.invalid/"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12l-8 8-9-9V4h7z"/><circle cx="8.5" cy="8.5" r="1.5"/></svg><span id="radarLbl">Price Radar</span></a>
  <a class="appsbtn" id="focusBtn" href="https://focus.mybrowser.invalid/"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9 2h6"/></svg><span id="focusLbl">Focus</span></a>
  </div>
  <div class="tiles" id="tiles"></div>
  <div class="note" data-i18n="startNote"></div>

  <dialog id="dlg">
    <form method="dialog" id="addForm">
      <h2 data-i18n="addSite"></h2>
      <label for="siteName" data-i18n="siteName"></label>
      <input id="siteName" maxlength="24">
      <label for="siteUrl" data-i18n="siteUrl"></label>
      <input id="siteUrl" dir="ltr" placeholder="tiktok.com">
      <div class="row">
        <button class="btn cancel" value="cancel" type="button" id="cancelAdd" data-i18n="cancel"></button>
        <button class="btn ok" value="ok" data-i18n="save"></button>
      </div>
    </form>
  </dialog>
<script src="start.js"></script>
</body>
</html>
