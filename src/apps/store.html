<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src https: data:; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title>MyBrowser Apps</title>
<style>
  :root { --void:#090A16; --ink:#EEF0FF; --mist:#A3A8C8; --line:rgba(255,255,255,.10); --iris:#8B7CFF; --azure:#4F8CFF; --aqua:#2EE6D6; --bloom:#FF6FD8;
    --ai: linear-gradient(110deg, #8B7CFF, #4F8CFF 45%, #2EE6D6); }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--void); color: var(--ink); font: 14px/1.45 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; }
  body { background: radial-gradient(900px 500px at 85% -10%, rgba(139,124,255,.18), transparent 60%),
    radial-gradient(700px 420px at -10% 110%, rgba(46,230,214,.10), transparent 60%), var(--void); }
  main { max-width: 980px; margin: 0 auto; padding: 34px 28px 60px; }
  header { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; margin-bottom: 8px; }
  h1 { margin: 0; font-size: 30px; font-weight: 650; letter-spacing: -.01em; background: var(--ai); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .sub { color: var(--mist); margin: 0 0 26px; max-width: 640px; }
  #q { margin-inline-start: auto; width: min(320px, 100%); height: 40px; border-radius: 14px; border: 1px solid var(--line);
    background: rgba(255,255,255,.05); color: var(--ink); padding: 0 14px; font: inherit; outline: none; }
  #q:focus { border-color: var(--azure); }
  h2 { font-size: 15px; font-weight: 600; color: var(--mist); margin: 26px 0 12px; }
  .mine { display: flex; flex-wrap: wrap; gap: 14px; }
  .mine .app { width: 96px; text-align: center; position: relative; cursor: pointer; border: 0; background: none; color: var(--ink); font: inherit; padding: 6px 0; border-radius: 16px; }
  .mine .app:hover { background: rgba(255,255,255,.05); }
  .mine .app:focus-visible, .card button:focus-visible { outline: 2px solid var(--azure); outline-offset: 2px; }
  .mine .nm { display: block; margin-top: 6px; font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 4px; }
  .x { position: absolute; top: 0; inset-inline-end: 8px; width: 22px; height: 22px; border-radius: 50%; border: 0; display: none; cursor: pointer;
    background: rgba(10,11,22,.85); color: var(--mist); font-size: 12px; }
  .mine .app:hover .x { display: block; }
  .x:hover { background: #E0466A; color: #fff; }
  .logo { width: 60px; height: 60px; margin: 0 auto; border-radius: 18px; background: linear-gradient(160deg, #fff, #EEF0FF); display: grid; place-items: center;
    box-shadow: 0 6px 18px rgba(0,0,0,.35); overflow: hidden; color: #5B5FEF; font-weight: 700; font-size: 24px; }
  .logo img { width: 38px; height: 38px; }
  .empty { color: var(--mist); font-size: 13px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
  .card { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px; padding: 16px 12px 14px; border-radius: 18px; border: 1px solid var(--line);
    background: linear-gradient(160deg, rgba(255,255,255,.07), rgba(255,255,255,.02)); }
  .card .logo { width: 56px; height: 56px; border-radius: 16px; margin: 0; flex: none; font-size: 22px; }
  .card .logo img { width: 34px; height: 34px; }
  .meta { min-width: 0; width: 100%; }
  .meta b { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .meta span { display: block; color: var(--mist); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; direction: ltr; }
  .card button { flex: none; width: 100%; height: 32px; padding: 0 14px; border-radius: 11px; border: 0; cursor: pointer; font: inherit; font-weight: 600; font-size: 13px; }
  .add { background: var(--ai); color: #0A0B16; }
  .openb { background: rgba(255,255,255,.10); color: var(--ink); }
  .card button:disabled { opacity: .6; cursor: progress; }
  .card.own { border-style: dashed; cursor: pointer; color: var(--ink); font: inherit; height: auto; width: auto; padding: 16px 12px 14px; border-radius: 18px; background: transparent; justify-content: center; }
  .own .logo { background: rgba(255,255,255,.06); color: var(--ink); box-shadow: none; border: 1.5px dashed rgba(255,255,255,.28); font-weight: 300; font-size: 26px; }
  .note { margin-top: 30px; color: #6E7396; font-size: 12.5px; }
  #toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); padding: 10px 18px; border-radius: 14px; background: rgba(24,26,58,.96);
    border: 1px solid rgba(139,124,255,.4); box-shadow: 0 12px 40px rgba(0,0,0,.5); display: none; max-width: 90vw; }
  dialog { border: 1px solid rgba(255,255,255,.16); border-radius: 22px; padding: 26px 28px 24px; width: min(460px, 92vw); color: var(--ink);
    background: rgba(18,20,46,.98); box-shadow: 0 20px 60px rgba(0,0,0,.6); }
  dialog::backdrop { background: rgba(4,5,14,.6); backdrop-filter: blur(4px); }
  dialog h3 { margin: 0 0 14px; font-size: 17px; }
  dialog label { display: block; color: var(--mist); font-size: 12.5px; margin: 10px 0 5px; }
  dialog input { display: block; width: 100%; height: 44px; border-radius: 12px; border: 1px solid var(--line); background: rgba(255,255,255,.05); color: var(--ink); padding: 0 12px; font: inherit; outline: none; }
  dialog input:focus { border-color: var(--azure); }
  .row { display: flex; gap: 10px; justify-content: flex-end; margin-top: 22px; }
  .row button { height: 40px; min-width: 96px; padding: 0 20px; border-radius: 12px; border: 0; cursor: pointer; font: inherit; font-weight: 600; }
  .cancel { background: rgba(255,255,255,.08); color: var(--ink); }
  @media (prefers-reduced-motion: no-preference) { .card { transition: border-color .15s, transform .15s; } .card:hover { border-color: rgba(139,124,255,.45); transform: translateY(-1px); } }
</style>
</head>
<body>
<main>
  <header><h1 id="t"></h1><input id="q" type="search" autocomplete="off"></header>
  <p class="sub" id="sub"></p>
  <h2 id="hMine"></h2>
  <div class="mine" id="mine"></div>
  <h2 id="hAll"></h2>
  <div class="grid" id="grid"></div>
  <p class="note" id="note"></p>
</main>
<div id="toast" role="status"></div>
<dialog id="dlg">
  <form method="dialog" id="f">
    <h3 id="dT"></h3>
    <label for="nm" id="dN"></label><input id="nm" maxlength="30">
    <label for="url" id="dU"></label><input id="url" dir="ltr" placeholder="example.com">
    <div class="row"><button type="button" class="cancel" id="cancel"></button><button class="add" id="save"></button></div>
  </form>
</dialog>
<script src="store.js"></script>
</body>
</html>
